```yaml
name: SkillBridge AI CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-test-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # =========================
      # BACKEND
      # =========================
      - name: Setup Backend
        run: |
          python3 -m venv backend/venv
          backend/venv/bin/python -m pip install --upgrade pip
          backend/venv/bin/python -m pip install -r backend/requirements.txt
          backend/venv/bin/python -m pip install pytest

      - name: Run Backend Tests
        run: |
          backend/venv/bin/python -m pytest backend/tests

      # =========================
      # FRONTEND
      # =========================
      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

      # =========================
      # DEPLOY FRONTEND
      # =========================
      - name: Deploy Frontend
        run: |
          sudo rm -rf /var/www/skillbridge-ai/*
          sudo cp -r frontend/dist/* /var/www/skillbridge-ai/

      # =========================
      # NGINX
      # =========================
      - name: Restart Nginx
        run: |
          sudo systemctl restart nginx

      - name: Deployment Complete
        run: |
          echo "================================="
          echo "SkillBridge AI deployed successfully"
          echo "================================="
```
